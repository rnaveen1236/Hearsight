name: Build APK

# Builds an installable HearSight APK on GitHub's servers:
#   1. navcore unit tests
#   2. Intel's librealsense Android library (enables the RealSense camera)   - optional
#   3. the SegFormer segmentation model (enables road / people detection)    - optional
#   4. the APK, with whichever of 2 and 3 succeeded
# Download it from the run's "Artifacts" section.

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBREALSENSE_TAG: v2.55.1

jobs:
  test:
    name: navcore tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew :navcore:test --stacktrace
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: navcore-test-report
          path: navcore/build/reports/tests/test

  librealsense:
    name: librealsense AAR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true  # the APK still builds (demo mode) without it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            17
      - name: Cache AAR
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/librealsense.aar
          key: librealsense-aar-${{ env.LIBREALSENSE_TAG }}-${{ hashFiles('scripts/build_librealsense_aar.sh') }}
      - name: Build AAR
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Intel's Android wrapper uses an old Gradle; try JDK 17, then JDK 11.
          scripts/build_librealsense_aar.sh "$LIBREALSENSE_TAG" \
            || JAVA_HOME="$JAVA_HOME_11_X64" scripts/build_librealsense_aar.sh "$LIBREALSENSE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: librealsense-aar
          path: app/libs/librealsense.aar
          if-no-files-found: error

  segmentation-model:
    name: Segmentation model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true  # the APK still builds (no road detection) without it
    steps:
      - uses: actions/checkout@v4
      - name: Cache model
        id: cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/segmentation.onnx
          key: segmentation-onnx-${{ hashFiles('scripts/export_segmentation_model.py') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - name: Export SegFormer-B0 (Cityscapes) to ONNX
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers onnx onnxruntime onnxscript
          python scripts/export_segmentation_model.py
      - uses: actions/upload-artifact@v4
        with:
          name: segmentation-model
          path: app/src/main/assets/segmentation.onnx
          if-no-files-found: error

  apk:
    name: APK
    needs: [test, librealsense, segmentation-model]
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Get librealsense AAR
        id: aar
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: librealsense-aar
          path: app/libs
      - name: Get segmentation model
        id: model
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: segmentation-model
          path: app/src/main/assets
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Name the APK
        run: |
          variant="demo-only"
          [ -f app/libs/librealsense.aar ] && variant="realsense"
          [ -f app/src/main/assets/segmentation.onnx ] && variant="$variant+segmentation"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/hearsight-$variant.apk"
          {
            echo "## HearSight APK: \`hearsight-$variant.apk\`"
            echo ""
            echo "| Feature | Included |"
            echo "|---|---|"
            echo "| Demo mode (simulated camera) | yes |"
            echo "| RealSense camera (librealsense AAR) | $([ -f app/libs/librealsense.aar ] && echo yes || echo 'no: see the librealsense job') |"
            echo "| Road / people detection (segmentation model) | $([ -f app/src/main/assets/segmentation.onnx ] && echo yes || echo 'no: see the segmentation job') |"
            echo ""
            echo "Download it under **Artifacts** below, copy it to the phone and open it to install"
            echo "(allow installing from this source). Each run is signed with a fresh debug key:"
            echo "uninstall the previous HearSight before installing a new build."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hearsight-apk
          path: out/*.apk
          if-no-files-found: error
